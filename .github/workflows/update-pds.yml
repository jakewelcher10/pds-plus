name: Update PDS Plus

on:
  workflow_dispatch:

  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Calculate PDS Plus
        run: python pds_calculator.py

      - name: Save updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pds_leaderboard.csv pds_leaderboard.html
          git diff --cached --quiet || git commit -m "Update PDS+ leaderboard"
          git push
