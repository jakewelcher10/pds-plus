<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDS+ Leaderboard</title>
<meta property="og:title" content="PDS+ Leaderboard" />
<meta property="og:description" content="Pitcher Dominance Score - a live, daily-updating pitcher leaderboard measuring bat-missing, command, and contact management." />
<meta property="og:image" content="https://jakewelcher10.github.io/pds-plus/preview.png" />
<meta property="og:url" content="https://jakewelcher10.github.io/pds-plus/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="PDS+ Leaderboard" />
<meta name="twitter:description" content="Pitcher Dominance Score - a live, daily-updating pitcher leaderboard measuring bat-missing, command, and contact management." />
<meta name="twitter:image" content="https://jakewelcher10.github.io/pds-plus/preview.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital@0;1&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --paper: #efe6d3;
    --ink: #1b2a4a;
    --ink-soft: #4a5677;
    --brass: #b8912a;
    --brass-dim: #d8c48f;
    --red: #b8443f;
    --grey: #7a7568;
    --green: #3f7d4f;
    --line: #c9bd9e;
    --card: #f6f0e2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Libre Baskerville', serif;
    padding: 40px 24px 80px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    border-bottom: 3px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 10px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 2px;
    margin: 0;
    line-height: 0.9;
    color: var(--ink);
  }

  h1 span { color: var(--brass); }

  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .input-panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 32px;
  }

  .input-panel label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 110px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
    resize: vertical;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  button {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 22px;
    border-radius: 3px;
    cursor: pointer;
  }

  button:hover { background: var(--brass); color: var(--ink); }

  .row {
    display: grid;
    grid-template-columns: 34px 1fr 70px 66px 110px;
    align-items: center;
    gap: 14px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
  }

  .name-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .team-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
    white-space: nowrap;
  }

  .percentile {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
  }

  .row.head {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
  }

  .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--ink-soft);
    text-align: center;
  }

  .name {
    font-size: 16px;
  }

  .score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    text-align: right;
  }

  .score.tier-green { color: var(--green); }
  .score.tier-grey { color: var(--grey); }
  .score.tier-red { color: var(--red); }

  .percentile.tier-green { color: var(--green); }
  .percentile.tier-grey { color: var(--grey); }
  .percentile.tier-red { color: var(--red); }

  .bar-track {
    height: 10px;
    background: #e2d8bf;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    background: var(--brass);
  }

  .bar-fill.tier-green { background: var(--green); }
  .bar-fill.tier-grey { background: var(--grey); }
  .bar-fill.tier-red { background: var(--red); opacity: 0.85; }

  .filter-panel {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--card);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .search-panel {
    margin-bottom: 18px;
  }

  #searchBox {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }

  #searchBox:focus {
    outline: none;
    border-color: var(--brass);
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    padding-right: 34px;
  }

  .clear-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
  }

  .clear-btn:hover {
    color: var(--ink);
  }

  .empty {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 30px 6px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 4px;
  }

  footer {
    margin-top: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    text-align: right;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>PDS<span>+</span></h1>
      <div class="subtitle">Pitcher Dominance Score</div>
    </div>
  </header>

  <div class="input-panel" id="inputPanel" style="display:none;">
    <label for="raw">Paste player_name / Team / PDS+ data (comma or tab separated, one pitcher per line)</label>
    <textarea id="raw" placeholder="Drew Rasmussen, MIL, 112.4&#10;Paul Skenes, PIT, 118.9&#10;..."></textarea>
    <div class="controls">
      <span class="hint">First line can optionally be a header row &mdash; it's detected automatically.</span>
      <button onclick="render()">Build Leaderboard</button>
    </div>
  </div>

  <div class="filter-panel">
    <button class="filter-btn active" data-role="ALL" onclick="setRoleFilter('ALL')">All</button>
    <button class="filter-btn" data-role="SP" onclick="setRoleFilter('SP')">Starters</button>
    <button class="filter-btn" data-role="RP" onclick="setRoleFilter('RP')">Relievers</button>
  </div>

  <div class="search-panel">
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="Search for a pitcher..." oninput="filterTable()">
      <button id="clearSearch" class="clear-btn" onclick="clearSearch()" style="display:none;">&times;</button>
    </div>
  </div>

  <div id="table"></div>

  <footer id="stamp"></footer>
</div>

<script>
const DEFAULT_DATA = `__PDS_DATA_PLACEHOLDER__`;

const TEAM_COLORS = {
  ARI: '#A71930', AZ: '#A71930', ATL: '#13274F', BAL: '#DF4601', BOS: '#BD3039', CHC: '#0E3386',
  CWS: '#27251F', CIN: '#C6011F', CLE: '#00385D', COL: '#333366', DET: '#0C2C56',
  HOU: '#002D62', KC: '#004687', LAA: '#BA0021', LAD: '#005A9C', MIA: '#00A3E0',
  MIL: '#12284B', MIN: '#002B5C', NYM: '#002D72', NYY: '#003087', ATH: '#003831',
  OAK: '#003831', PHI: '#E81828', PIT: '#27251F', SD: '#2F241D', SF: '#FD5A1E',
  SEA: '#0C2C56', STL: '#C41E3A', TB: '#092C5C', TEX: '#003278', TOR: '#134A8E',
  WSH: '#AB0003'
};

function teamColor(team) {
  if (!team) return '#8a8375';
  return TEAM_COLORS[team.toUpperCase()] || '#8a8375';
}

function splitCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(cur);
      cur = '';
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function toFirstLast(name) {
  const parts = name.split(',').map(p => p.trim());
  if (parts.length === 2 && parts[0] && parts[1]) {
    return `${parts[1]} ${parts[0]}`;
  }
  return name;
}

function parseInput(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  const splitLine = (line) => line.includes('\t') ? line.split('\t') : splitCSVLine(line);

  let rows = lines.map(splitLine).map(cols => cols.map(c => c.trim()));

  const colCount = rows[0] ? rows[0].length : 0;
  const hasRoleCol = colCount >= 4;
  const hasTeamCol = colCount >= 3;

  const lastIdx = colCount - 1;
  if (rows.length && isNaN(parseFloat(rows[0][lastIdx]))) {
    rows = rows.slice(1);
  }

  const minCols = hasRoleCol ? 4 : (hasTeamCol ? 3 : 2);

  const parsed = rows
    .filter(r => r.length >= minCols && !isNaN(parseFloat(r[minCols - 1])))
    .map(r => ({
      name: toFirstLast(r[0]),
      team: hasTeamCol ? r[1] : '',
      role: hasRoleCol ? r[2].toUpperCase() : '',
      pds: parseFloat(r[minCols - 1])
    }))
    .sort((a, b) => b.pds - a.pds);

  const n = parsed.length;
  parsed.forEach((d, i) => {
    d.percentile = n > 1 ? Math.round(((n - 1 - i) / (n - 1)) * 100) : 100;
  });

  return parsed;
}

let allData = [];
let minVal = 100;
let maxVal = 100;
let currentRoleFilter = 'ALL';

function setRoleFilter(role) {
  currentRoleFilter = role;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.role === role);
  });
  filterTable();
}

function getFilteredByRole() {
  if (currentRoleFilter === 'ALL') return allData;
  return allData.filter(d => d.role === currentRoleFilter);
}

function renderTable(list) {
  const table = document.getElementById('table');
  const stamp = document.getElementById('stamp');

  if (!list.length) {
    table.innerHTML = '<div class="empty">No pitchers match that search.</div>';
    stamp.textContent = '';
    return;
  }

  const span = Math.max(maxVal - minVal, 1);

  let html = '<div class="row head"><div>Rk</div><div>Pitcher</div><div style="text-align:right">PDS+</div><div style="text-align:right">Pctl</div><div>vs. League Mean</div></div>';

  const tierFor = (percentile) => {
    if (percentile >= 61) return 'tier-green';
    if (percentile >= 40) return 'tier-grey';
    return 'tier-red';
  };

  list.forEach((d, i) => {
    const tier = tierFor(d.percentile);
    const pct = ((d.pds - minVal) / span) * 100;
    const badge = d.team
      ? `<span class="team-badge" style="background:${teamColor(d.team)}">${d.team.toUpperCase()}</span>`
      : '';
    html += `
      <div class="row">
        <div class="rank">${i + 1}</div>
        <div class="name-cell"><span class="name">${d.name}</span>${badge}</div>
        <div class="score ${tier}">${d.pds.toFixed(1)}</div>
        <div class="percentile ${tier}">${d.percentile}th</div>
        <div class="bar-track"><div class="bar-fill ${tier}" style="width:${Math.max(pct, 4)}%"></div></div>
      </div>`;
  });

  table.innerHTML = html;
  stamp.textContent = `${list.length} of ${allData.length} pitchers · generated ${new Date().toLocaleDateString()}`;
}

function render() {
  const raw = document.getElementById('raw').value;
  allData = parseInput(raw);

  maxVal = Math.max(...allData.map(d => d.pds), 100);
  minVal = Math.min(...allData.map(d => d.pds), 100);

  const searchBox = document.getElementById('searchBox');
  if (searchBox) searchBox.value = '';

  renderTable(getFilteredByRole());
}

function filterTable() {
  const query = document.getElementById('searchBox').value.trim().toLowerCase();
  document.getElementById('clearSearch').style.display = query ? 'block' : 'none';
  const roleFiltered = getFilteredByRole();
  const finalFiltered = query
    ? roleFiltered.filter(d => d.name.toLowerCase().includes(query))
    : roleFiltered;
  renderTable(finalFiltered);
}

function clearSearch() {
  document.getElementById('searchBox').value = '';
  filterTable();
}

document.getElementById('raw').value = DEFAULT_DATA;

if (new URLSearchParams(window.location.search).has('edit')) {
  document.getElementById('inputPanel').style.display = 'block';
}

render();
</script>
</body>
</html>
